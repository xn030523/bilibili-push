name: AI 日报自动发布

on:
  schedule:
    # UTC 0 点 = 北京时间 8 点（GitHub cron 是 UTC，改成你想要的时间）
    - cron: '0 0 * * *'
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装系统依赖（ffmpeg + 中文字体 + Chrome 运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk fonts-noto-color-emoji \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 \
            libpango-1.0-0 libcairo2 libx11-6 libxcb1 libxext6 libglib2.0-0

      - name: 安装 Node 依赖
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 下载 Remotion 渲染浏览器
        run: npx remotion browser ensure

      - name: 运行管道（采集→改写→TTS→渲染→发布）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
        run: npx tsx src/index.ts

      - name: 持久化处理记录（防重复发布）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 记录已处理日报 [skip ci]"
            git push
          fi

      - name: 上传成片（保留 7 天可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-video
          path: |
            output/final.mp4
            output/cover.png
            output/publish.json
          retention-days: 7
