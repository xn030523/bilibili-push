services:
  aihot:
    build: .
    container_name: aihot-bili
    ports:
      - "3000:3000"
    environment:
      - PANEL_PORT=3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - BILI_SESSDATA=${BILI_SESSDATA:-}
      - BILI_JCT=${BILI_JCT:-}
    volumes:
      - ./config.json:/app/config.json
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
